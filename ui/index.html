<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD Viewer</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <header class="side-head">
      <div class="root-name" id="root-name" title="">フォルダ未選択</div>
      <button class="icon-btn" id="btn-open" title="フォルダを開く (⌘O)" aria-label="フォルダを開く">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
    </header>
    <div class="filter-wrap">
      <input id="filter" type="search" placeholder="ファイル名で絞り込み" autocomplete="off" spellcheck="false">
    </div>
    <nav id="tree" aria-label="ファイル"></nav>
    <div id="fts-wrap">
      <div id="fts-results"></div>
    </div>
  </aside>
  <div id="resizer" aria-hidden="true"></div>

  <main id="main">
    <div id="pathbar">
      <span id="pathbar-text"></span>
      <button id="btn-toc" class="icon-btn" title="目次 (⌘T)" aria-label="目次" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="2" y1="4.5" x2="14" y2="4.5"/><line x1="2" y1="8.5" x2="10" y2="8.5"/><line x1="2" y1="12.5" x2="12" y2="12.5"/>
        </svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="設定 (⌘,)" aria-label="設定" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
      </button>
      <button id="btn-focus" class="icon-btn" title="フォーカスモード" aria-label="フォーカスモード" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>
    <div id="settings-panel" aria-label="設定" aria-hidden="true">
      <div class="settings-section">
        <label class="settings-toggle-row">
          <span>ダークモード</span>
          <button id="toggle-dark-mode" class="settings-toggle-btn" role="switch" aria-checked="false"></button>
        </label>
      </div>
      <div class="settings-section">
        <div class="settings-label">コンテンツ幅</div>
        <div class="settings-choices" id="width-choices">
          <button class="settings-choice" data-value="narrow">狭</button>
          <button class="settings-choice" data-value="standard">標準</button>
          <button class="settings-choice" data-value="wide">広</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">カラーテーマ</div>
        <div class="settings-choices" id="theme-choices">
          <button class="settings-choice theme-swatch" data-value="rose"><span class="swatch-dot swatch-rose"></span>Rose</button>
          <button class="settings-choice theme-swatch" data-value="ocean"><span class="swatch-dot swatch-ocean"></span>Ocean</button>
          <button class="settings-choice theme-swatch" data-value="mono"><span class="swatch-dot swatch-mono"></span>Mono</button>
        </div>
      </div>
      <div class="settings-section">
        <label class="settings-toggle-row">
          <span>画像に影を付ける</span>
          <button id="toggle-img-shadow" class="settings-toggle-btn" role="switch" aria-checked="false"></button>
        </label>
      </div>
      <div class="settings-section">
        <div class="settings-label">スクロール速度</div>
        <div class="settings-choices" id="scroll-choices">
          <button class="settings-choice" data-value="1">普通</button>
          <button class="settings-choice" data-value="2">速</button>
        </div>
      </div>
    </div>
    <div id="toc-panel" aria-label="目次">
      <div class="toc-header">目次</div>
      <nav id="toc-nav"></nav>
    </div>
    <div id="progress-bar" aria-hidden="true"></div>
    <div id="search-bar" role="search" aria-label="検索">
      <button id="search-scope" class="search-scope-btn" title="検索範囲を切替">ファイル内</button>
      <button id="search-regex" class="search-toggle" title="正規表現" aria-pressed="false">.*</button>
      <input id="search-input" type="search" placeholder="検索..." autocomplete="off" spellcheck="false">
      <span id="search-count" aria-live="polite"></span>
      <button id="search-prev" class="search-nav" title="前へ (Shift+Enter)" aria-label="前の一致">
        <svg viewBox="0 0 10 10" width="12" height="12"><path d="M2 7 5 3 8 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="search-next" class="search-nav" title="次へ (Enter)" aria-label="次の一致">
        <svg viewBox="0 0 10 10" width="12" height="12"><path d="M2 3 5 7 8 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="search-close" class="search-nav" title="閉じる (Esc)" aria-label="閉じる">
        <svg viewBox="0 0 10 10" width="12" height="12"><path d="M2 2 8 8M8 2 2 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="scroller">
      <article id="content" class="markdown-body"></article>
      <section id="empty">
        <div class="empty-gem" aria-hidden="true"></div>
        <h1>MD Viewer</h1>
        <p>フォルダを開くか、Markdownファイル・フォルダをここにドロップしてください。</p>
        <button class="primary-btn" id="btn-open-empty">フォルダを開く</button>
        <p class="hint">⌘O 開く ・ ⌘P 最近のファイル ・ ⌘B サイドバー ・ ⌘F 検索 ・ ⌘T 目次 ・ ⌘, 設定 ・ ⌘R 再読込 ・ ⌘+ / ⌘− 文字サイズ</p>
      </section>
    </div>
  </main>

  <div id="toast" role="status"></div>
  <button id="btn-focus-exit" title="フォーカスモードを終了 (Esc)" aria-label="フォーカスモードを終了">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
    </svg>
  </button>

  <div id="quickopen" role="dialog" aria-modal="true" aria-label="最近開いたファイル">
    <div id="quickopen-box">
      <input id="quickopen-input" type="search" placeholder="最近のファイルを絞り込み..." autocomplete="off" spellcheck="false">
      <div id="quickopen-list" role="listbox"></div>
    </div>
  </div>
  <script src="highlight.min.js"></script>
  <script src="mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
